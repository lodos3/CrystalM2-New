name: Lighting and faction regression tests
on:
  push:
    branches:
      - feature/lighting-map-spell-20261103
  pull_request:
    paths:
      - "Client/MirGraphics/MapLightEncoding.cs"
      - "Server/MirEnvir/MonsterFactionRules.cs"
      - "Tests/**"
      - ".github/workflows/lighting-factions-tests.yml"
jobs:
  pure-logic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Map light decoder
        run: dotnet run --project Tests/RenderingLightTests/RenderingLightTests.csproj
      - name: Monster faction rules
        run: dotnet run --project Tests/MonsterFactionTests/MonsterFactionTests.csproj
