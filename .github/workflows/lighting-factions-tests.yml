name: Crystal rendering, atmospheric weather and faction regressions
on:
  push:
    branches:
      - master
  pull_request:
    paths:
      - "Client.Rendering.Core/**"
      - "Client/Rendering/**"
      - "Client/MirControls/**"
      - "Client/MirScenes/Dialogs/**"
      - "Client/MirScenes/LoginScene.cs"
      - "Client/MirGraphics/MapLightEncoding.cs"
      - "Client/MirGraphics/MapMaterialMap.cs"
      - "Client/MirGraphics/MapMaterialMapLoader.cs"
      - "Client/MirGraphics/WetSurfacePass.cs"
      - "Client/MirGraphics/AtmosphereColourGrade.cs"
      - "Client/MirGraphics/AtmosphericWeatherController.cs"
      - "Client/MirGraphics/AtmosphereTileNoise.cs"
      - "Client/MirGraphics/AtmosphereFogOverlay.cs"
      - "Client/MirGraphics/SmoothScalarTransition.cs"
      - "Client/MirGraphics/ParticleEngine.cs"
      - "Client/MirGraphics/LightVisibility.cs"
      - "Client/MirGraphics/BloomBufferLayout.cs"
      - "Client/MirGraphics/LightBloomPass.cs"
      - "Client/MirGraphics/MapLightViewportCache.cs"
      - "Client/MirGraphics/ShadowMaskBudget.cs"
      - "Client/MirGraphics/SpriteFileLayout.cs"
      - "Client/MirGraphics/AlphaCoverage.cs"
      - "Client/Data/Shaders/**"
      - "Client/Settings.cs"
      - "Client/Client.csproj"
      - "Client/MirObjects/MapCode.cs"
      - "Client/MirGraphics/AmbientLightTransition.cs"
      - "Client/MirScenes/GameScene.cs"
      - "Client/MirGraphics/MLibrary.cs"
      - "Client/MirGraphics/DXManager.cs"
      - "Client/MirControls/MirControl.cs"
      - "Client/Forms/CMain.cs"
      - "Server/MirEnvir/MonsterFactionRules.cs"
      - "Tests/**"
      - "Shared/SpellCurriculum.cs"
      - "Server/MirDatabase/CharacterInfo.cs"
      - "Server/MirDatabase/HeroInfo.cs"
      - "Server/MirEnvir/Envir.cs"
      - "Server/MirObjects/HumanObject.cs"
      - "Server/MirObjects/PlayerObject.cs"
      - "Server/MirObjects/HeroObject.cs"
      - "Server.MirForms/Database/MagicInfoForm.cs"
      - ".github/workflows/lighting-factions-tests.yml"
jobs:
  pure-logic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Bookless five-class spell and specialisation catalog tests
        run: dotnet run --project Tests/SpellCurriculumTests/SpellCurriculumTests.csproj
      - name: Specialisation protocol round-trip tests
        run: dotnet run --project Tests/SpecialisationProtocolTests/SpecialisationProtocolTests.csproj
      - name: Server signature combat and Magic database tests
        run: dotnet run --project Tests/SpecialisationCombatTests/SpecialisationCombatTests.csproj
      - name: Modern renderer asset-fidelity and batching tests
        run: dotnet run --project Tests/ModernRendererTests/ModernRendererTests.csproj
      - name: Generated UI atlas and nine-slice geometry
        run: dotnet run --project Tests/UiSkinTests/UiSkinTests.csproj
      - name: Map light decoder
        run: dotnet run --project Tests/RenderingLightTests/RenderingLightTests.csproj
      - name: Atmospheric lighting and bloom geometry
        run: dotnet run --project Tests/VisualPipelineTests/VisualPipelineTests.csproj
      - name: Viewport map light cache and shadow projection
        run: dotnet run --project Tests/LightViewportTests/LightViewportTests.csproj
      - name: GPU shadow memory cap and LIB parsing
        run: dotnet run --project Tests/RenderingMemoryTests/RenderingMemoryTests.csproj
      - name: Monster faction rules
        run: dotnet run --project Tests/MonsterFactionTests/MonsterFactionTests.csproj
      - name: Texture alpha packing and hit testing
        run: dotnet run --project Tests/TextureAlphaTests/TextureAlphaTests.csproj
      - name: Day-night ambient transition regression tests
        run: dotnet run --project Tests/AmbientLightTests/AmbientLightTests.csproj

  windows-client-compile:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Compile authoritative spell server and versioned database
        run: dotnet build Server/Server.Library.csproj --configuration Release
      - name: Compile server database magic editor and WinForms host
        run: dotnet build Server.MirForms/Server.csproj --configuration Release
      - name: Restore Windows CrystalM2 client
        run: dotnet restore Client/Client.csproj
      - name: Compile the sole Vortice D3D11 game client
        run: dotnet build Client/Client.csproj --configuration Release --no-restore
      - name: Validate authored Taoist ward particles without GPU
        run: dotnet run --project Tests/TaoistParticleTests/TaoistParticleTests.csproj --configuration Release
      - name: Validate production D3D11 shaders and compositor on real WARP
        run: dotnet run --project Tests/WindowsRendererTests/WindowsRendererTests.csproj --configuration Release
      - name: Publish the sole Windows x64 client
        run: dotnet publish Client/Client.csproj --configuration Release --runtime win-x64 --self-contained false --output artifacts/client
      - uses: actions/upload-artifact@v4
        with:
          name: CrystalM2-Vortice-win-x64
          path: artifacts/client
